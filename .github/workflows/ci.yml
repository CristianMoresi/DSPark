name: CI

# Measurement branch: the new tests on three compilers and the figures of the change, before the full run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    name: new tests, ${{ matrix.cxx }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxx: g++,     os: ubuntu-24.04,     arch: "" }
          - { cxx: clang++, os: ubuntu-24.04,     arch: "" }
          - { cxx: g++,     os: ubuntu-latest,    arch: "-march=x86-64" }
          - { cxx: g++,     os: ubuntu-24.04-arm, arch: "" }
    steps:
      - uses: actions/checkout@v7
      - name: TestEffectsAdvanced
        if: always()
        run: |
          ${{ matrix.cxx }} -std=c++20 -O3 ${{ matrix.arch }} -Wall -Wextra -Werror -Wpedantic -pthread -I . tests/main.cpp tests/TestEffectsAdvanced.cpp -o t1
          ./t1 --prefix ResonanceSuppressor_time
          ./t1 --prefix SpectralDynamicEQ_time
          ./t1 --prefix TonalBalance_time
      - name: TestCoreSpectral
        if: always()
        run: |
          ${{ matrix.cxx }} -std=c++20 -O3 ${{ matrix.arch }} -Wall -Wextra -Werror -Wpedantic -pthread -I . tests/main.cpp tests/TestCoreSpectral.cpp -o t2
          ./t2 --prefix SpectralFilter_time
      - name: Standalone and smoke compile
        if: always()
        run: |
          ${{ matrix.cxx }} -std=c++20 -O3 ${{ matrix.arch }} -Wall -Wextra -Werror -Wpedantic -I . -c tests/standalone_compile_test.cpp -o standalone.o
          ${{ matrix.cxx }} -std=c++20 -O3 ${{ matrix.arch }} -Wall -Wextra -Werror -Wpedantic -I . -c tests/functional_smoke_test.cpp -o smoke.o
          ${{ matrix.cxx }} -std=c++20 -O2 ${{ matrix.arch }} -Wall -Wextra -Werror -Wpedantic -I . -c bench/dspark_bench.cpp -o bench.o
          ${{ matrix.cxx }} -std=c++20 -O2 ${{ matrix.arch }} -Wall -Wextra -Werror -Wpedantic -I . -c conformance/dspark_conformance.cpp -o conformance.o

  trial-msvc:
    name: new tests, msvc ${{ matrix.arch }}
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: TestEffectsAdvanced
        if: always()
        shell: bash
        run: |
          mkdir obj1 && cl -nologo -std:c++20 -EHsc -O2 -W4 -WX -wd4324 -bigobj -I . -Foobj1/ tests/main.cpp tests/TestEffectsAdvanced.cpp -Fe:t1.exe > build1.log 2>&1 || { grep -i "error\|warning" build1.log | head -40; exit 1; }
          ./t1.exe --prefix ResonanceSuppressor_time
          ./t1.exe --prefix SpectralDynamicEQ_time
          ./t1.exe --prefix TonalBalance_time
      - name: TestCoreSpectral
        if: always()
        shell: bash
        run: |
          mkdir obj2 && cl -nologo -std:c++20 -EHsc -O2 -W4 -WX -wd4324 -bigobj -I . -Foobj2/ tests/main.cpp tests/TestCoreSpectral.cpp -Fe:t2.exe > build2.log 2>&1 || { grep -i "error\|warning" build2.log | head -40; exit 1; }
          ./t2.exe --prefix SpectralFilter_time
      - name: Standalone compile
        if: always()
        shell: bash
        run: |
          mkdir objA && cl -nologo -std:c++20 -EHsc -W4 -WX -wd4324 -bigobj -I . -FoobjA/ -c tests/standalone_compile_test.cpp > buildA.log 2>&1 || { grep -i "error\|warning" buildA.log | head -40; exit 1; }
      - name: Laboratory build
        if: always() && matrix.arch == 'x64'
        shell: bash
        run: |
          cd DSParkLab
          cl -nologo -std:c++20 -O2 -W4 -EHsc -MP -DUNICODE -DNOMINMAX -I.. -Ivendor -Ivendor/imgui main.cpp vendor/imgui/imgui.cpp vendor/imgui/imgui_draw.cpp vendor/imgui/imgui_tables.cpp vendor/imgui/imgui_widgets.cpp vendor/imgui/imgui_impl_win32.cpp vendor/imgui/imgui_impl_dx11.cpp -Fe:lab.exe -link d3d11.lib d3dcompiler.lib user32.lib gdi32.lib ole32.lib comdlg32.lib > lab.log 2>&1 || { grep -i "error" lab.log | head -40; exit 1; }
          echo "laboratory builds"

  checks:
    name: text and documentation
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Comment style
        if: always()
        run: python3 tools/check_comment_style.py
      - name: Threading page
        if: always()
        run: python3 tools/verify_threading_doc.py
      - name: Dependent comparisons
        if: always()
        run: python3 tools/check_dependent_comparisons.py
      - name: Public text
        if: always()
        run: python3 tools/check_public_text.py
      - name: API reference
        if: always()
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y doxygen graphviz; then break; fi
            sleep 20
          done
          doxygen Doxyfile > doxygen.log 2>&1 || { tail -40 doxygen.log; exit 1; }
          python3 tools/check_generated_docs.py --html-root docs/api --repair-doxygen-indexes

  headers:
    name: headers, ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v7
      - name: Every installed header on its own
        run: python3 tools/check_header_self_sufficiency.py --compiler ${{ matrix.compiler }} --std c++20 --warnings-as-errors
